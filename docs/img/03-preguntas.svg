<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="800" height="420" fill="#f4f1ec"/>
  <rect x="30" y="20" width="740" height="380" rx="12" fill="#ffffff" stroke="#d9d4cc"/>
  <!-- mensaje del usuario -->
  <rect x="420" y="44" width="320" height="40" rx="12" fill="#f2eee8"/>
  <text x="440" y="69" font-size="13" fill="#3d372f">Para Panadería Sol, un vídeo con stock…</text>
  <!-- respuesta -->
  <circle cx="64" cy="114" r="12" fill="#d97757"/>
  <text x="86" y="119" font-size="14" fill="#2b2620">Antes de empezar necesito dos cosas:</text>
  <!-- tarjeta de preguntas -->
  <rect x="86" y="138" width="640" height="232" rx="12" fill="#faf8f5" stroke="#d9d4cc"/>
  <text x="108" y="168" font-size="14" font-weight="700" fill="#2b2620">¿Para qué plataforma y formato?</text>
  <g font-size="13">
    <rect x="108" y="180" width="200" height="34" rx="8" fill="#fbe9e2" stroke="#d97757" stroke-width="2"/><text x="208" y="202" text-anchor="middle" fill="#2b2620" font-weight="700">Reel 9:16 (recomendado)</text>
    <rect x="318" y="180" width="140" height="34" rx="8" fill="#ffffff" stroke="#d9d4cc"/><text x="388" y="202" text-anchor="middle" fill="#3d372f">Feed 4:5</text>
    <rect x="468" y="180" width="140" height="34" rx="8" fill="#ffffff" stroke="#d9d4cc"/><text x="538" y="202" text-anchor="middle" fill="#3d372f">TikTok 9:16</text>
  </g>
  <text x="108" y="250" font-size="14" font-weight="700" fill="#2b2620">¿Qué estilo?</text>
  <g font-size="13">
    <rect x="108" y="262" width="200" height="34" rx="8" fill="#ffffff" stroke="#d9d4cc"/><text x="208" y="284" text-anchor="middle" fill="#3d372f">Como los de referencia</text>
    <rect x="318" y="262" width="140" height="34" rx="8" fill="#ffffff" stroke="#d9d4cc"/><text x="388" y="284" text-anchor="middle" fill="#3d372f">POV con stock</text>
    <rect x="468" y="262" width="140" height="34" rx="8" fill="#ffffff" stroke="#d9d4cc"/><text x="538" y="284" text-anchor="middle" fill="#3d372f">Solo tipografía</text>
  </g>
  <text x="108" y="330" font-size="12" fill="#7a7266">También puedes escribir otra respuesta con tus palabras.</text>
  <rect x="616" y="320" width="90" height="32" rx="8" fill="#2b2620"/><text x="661" y="341" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Enviar</text>
  <text x="400" y="414" font-size="11" fill="#9a9285" text-anchor="middle">Ilustración esquemática · Si falta el formato o el estilo, Claude pregunta antes de empezar</text>
</svg>
